<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pump.kin // GHOST_CHAIN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Heavy CRT Overlays -->
    <div class="scanlines"></div>
    <div class="crt-overlay"></div>
    <div class="noise"></div>
    
    <div class="screen-container">
        <!-- Boot Screen -->
        <div id="boot-screen">
            <pre class="glitch" id="ascii-pumpkin">
      ___
   ___/   \___
  /   _   _   \
 /   / \ / \   \
|    \_/ \_/    |
 \      X      /
  \___/   \___/
            </pre>
            <div id="boot-text">PUMP.KIN OS v6.6.6 [BIOS MEMORY CHECK... OK]</div>
            <div id="boot-details"></div>
        </div>

        <!-- Main Terminal -->
        <div class="terminal" id="terminal" style="display: none;">
            <div id="output"></div>
            <div class="input-line" id="input-container">
                <span class="prompt">oracle@pump.kin:~$</span>
                <input type="text" id="command-input" autocomplete="off" spellcheck="false" autofocus>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
